name: modern-flash

services:
  modern-flash-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: modern-flash-studio:latest
    container_name: modern-flash-studio
    ports:
      - "3800:3800"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
